{% extends "base.html" %}

{% block title %}Page Not Found - Tickets Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="error-page">
            <i class="fas fa-search fa-5x text-muted mb-4"></i>
            <h1 class="display-4 text-muted">404</h1>
            <h2 class="mb-3">Page Not Found</h2>
            <p class="lead text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            
            <div class="mb-4">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary me-2">
                    <i class="fas fa-home"></i> Return to Dashboard
                </a>
                <button class="btn btn-outline-secondary" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title">Quick Links</h6>
                    <div class="row">
                        <div class="col-6 mb-2">
                            <a href="{{ url_for('folders') }}" class="btn btn-sm btn-outline-info w-100">
                                <i class="fas fa-folder"></i> Folders
                            </a>
                        </div>
                        <div class="col-6 mb-2">
                            <a href="{{ url_for('create_ticket') }}" class="btn btn-sm btn-outline-success w-100">
                                <i class="fas fa-plus"></i> Create Ticket
                            </a>
                        </div>
                        <div class="col-6 mb-2">
                            <a href="{{ url_for('classify_test') }}" class="btn btn-sm btn-outline-warning w-100">
                                <i class="fas fa-robot"></i> Test Classification
                            </a>
                        </div>
                        <div class="col-6 mb-2">
                            <a href="{{ url_for('system_health') }}" class="btn btn-sm btn-outline-secondary w-100">
                                <i class="fas fa-heartbeat"></i> System Health
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

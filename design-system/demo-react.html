<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketIQ Design System - React Integration Demo</title>
    <link rel="stylesheet" href="dist/styles.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/antd@5.13.0/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd@5.13.0/dist/reset.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--color-theme-background);
            color: var(--color-theme-text);
        }
        
        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .demo-section {
            margin-bottom: 40px;
            padding: 24px;
            background-color: var(--color-theme-surface);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--color-theme-border);
        }
        
        .demo-section h2 {
            margin-top: 0;
            color: var(--color-theme-text);
            border-bottom: 1px solid var(--color-theme-border);
            padding-bottom: 12px;
        }
        
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="theme-dark" data-theme="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { ConfigProvider, Button, Input, Card, Space, Switch, Typography } = antd;
        const { Title, Text } = Typography;

        // Simple theme provider simulation
        const ThemeContext = React.createContext();

        function SimpleThemeProvider({ children }) {
            const [theme, setTheme] = useState('dark');

            const toggleTheme = () => {
                const newTheme = theme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
                
                // Apply theme to document
                document.body.className = `theme-${newTheme}`;
                document.body.setAttribute('data-theme', newTheme);
            };

            return (
                <ThemeContext.Provider value={{ theme, toggleTheme }}>
                    <ConfigProvider
                        theme={{
                            algorithm: theme === 'dark' ? antd.theme.darkAlgorithm : antd.theme.defaultAlgorithm,
                            token: {
                                colorPrimary: '#4f46e5',
                                colorSuccess: '#10b981',
                                colorWarning: '#f59e0b',
                                colorError: '#ef4444',
                                colorInfo: '#3b82f6',
                                fontFamily: 'Segoe UI, system-ui, sans-serif',
                                borderRadius: 8,
                            }
                        }}
                    >
                        {children}
                    </ConfigProvider>
                </ThemeContext.Provider>
            );
        }

        function ThemeSwitcher() {
            const { theme, toggleTheme } = React.useContext(ThemeContext);
            
            return (
                <div className="theme-switcher">
                    <Space>
                        <Text>🌙</Text>
                        <Switch 
                            checked={theme === 'light'} 
                            onChange={toggleTheme}
                        />
                        <Text>☀️</Text>
                    </Space>
                </div>
            );
        }

        function ButtonDemo() {
            return (
                <div className="demo-section">
                    <Title level={2}>Button Components</Title>
                    <div className="component-grid">
                        <Space direction="vertical" size="middle">
                            <Title level={4}>Primary Buttons</Title>
                            <Space wrap>
                                <Button type="primary" size="small">Small</Button>
                                <Button type="primary">Medium</Button>
                                <Button type="primary" size="large">Large</Button>
                            </Space>
                        </Space>
                        
                        <Space direction="vertical" size="middle">
                            <Title level={4}>Secondary Buttons</Title>
                            <Space wrap>
                                <Button>Default</Button>
                                <Button type="dashed">Dashed</Button>
                                <Button type="text">Text</Button>
                            </Space>
                        </Space>
                        
                        <Space direction="vertical" size="middle">
                            <Title level={4}>States</Title>
                            <Space wrap>
                                <Button type="primary" loading>Loading</Button>
                                <Button type="primary" disabled>Disabled</Button>
                                <Button danger>Danger</Button>
                            </Space>
                        </Space>
                    </div>
                </div>
            );
        }

        function InputDemo() {
            const [value, setValue] = useState('');
            
            return (
                <div className="demo-section">
                    <Title level={2}>Input Components</Title>
                    <div className="component-grid">
                        <Space direction="vertical" size="middle" style={{ width: '100%' }}>
                            <Title level={4}>Text Inputs</Title>
                            <Input placeholder="Default input" />
                            <Input placeholder="Large input" size="large" />
                            <Input placeholder="Small input" size="small" />
                        </Space>
                        
                        <Space direction="vertical" size="middle" style={{ width: '100%' }}>
                            <Title level={4}>Input States</Title>
                            <Input placeholder="Normal state" />
                            <Input placeholder="Error state" status="error" />
                            <Input placeholder="Warning state" status="warning" />
                        </Space>
                        
                        <Space direction="vertical" size="middle" style={{ width: '100%' }}>
                            <Title level={4}>Text Area</Title>
                            <Input.TextArea 
                                placeholder="Multi-line input"
                                rows={4}
                            />
                        </Space>
                    </div>
                </div>
            );
        }

        function CardDemo() {
            return (
                <div className="demo-section">
                    <Title level={2}>Card Components</Title>
                    <div className="component-grid">
                        <Card title="Default Card" size="default">
                            <Text>This is a default card with standard padding and styling.</Text>
                        </Card>
                        
                        <Card title="Small Card" size="small">
                            <Text>This is a small card with reduced padding.</Text>
                        </Card>
                        
                        <Card 
                            title="Interactive Card" 
                            hoverable
                            actions={[
                                <Button type="text" key="action1">Action 1</Button>,
                                <Button type="text" key="action2">Action 2</Button>
                            ]}
                        >
                            <Text>This card has hover effects and actions.</Text>
                        </Card>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <SimpleThemeProvider>
                    <div className="demo-container">
                        <ThemeSwitcher />
                        
                        <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                            <Title level={1}>TicketIQ Design System</Title>
                            <Text type="secondary">React Integration Demo</Text>
                        </div>
                        
                        <ButtonDemo />
                        <InputDemo />
                        <CardDemo />
                        
                        <div className="demo-section">
                            <Title level={2}>Design Tokens</Title>
                            <Text>
                                This demo showcases the React integration layer built on top of Ant Design,
                                using our design tokens for consistent theming. The theme switcher demonstrates
                                dynamic theme changes across all components.
                            </Text>
                        </div>
                    </div>
                </SimpleThemeProvider>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

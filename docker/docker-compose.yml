# TicketIQ Infrastructure Stack

services:
  # API Gateway - Traefik
  traefik:
    image: traefik:v3.0
    container_name: tickets_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--ping=true"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tickets_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: tickets_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Ollama for local LLM - using host Ollama to avoid port conflict
  # If you don't have Ollama on host, uncomment this service and change API's OLLAMA_BASE_URL
  ollama:
    image: ollama/ollama:latest
    container_name: tickets_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 30s

  # MLflow for model registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: tickets_mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak for OAuth2/OIDC auth
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tickets_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: tickets_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tickets_jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: tickets_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  # Promtail for log shipping
  promtail:
    image: grafana/promtail:latest
    container_name: tickets_promtail
    volumes:
      - /var/log:/var/log:ro
      - ../config/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tickets_grafana
    ports:
      - "3002:3000"  # Changed to 3002 to avoid conflict with frontend on 3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant vector store (optional, profile-based)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tickets_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    profiles:
      - vector-store
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3



  # FastAPI backend
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    image: tickets-api:latest
    container_name: tickets_api
    ports:
      - "8005:8005"  
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tickets_db
      OLLAMA_BASE_URL: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOKI_ENDPOINT: http://loki:3100
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UVICORN_WORKERS: "1"
      UVICORN_RELOAD: "true"
      TRANSFORMERS_CACHE: /tmp/huggingface
      HF_HOME: /tmp/huggingface
    volumes:
      - ../backend:/app
    restart: unless-stopped
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React frontend
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: tickets-frontend:latest
    container_name: tickets_frontend
    ports:
      - "3003:80"  
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # Flask admin interface
  flask-admin:
    build:
      context: ../backend
      dockerfile: Dockerfile.flask
    image: docker-flask-admin:latest
    container_name: tickets_flask_admin
    ports:
      - "5001:5000"
    environment:
      API_BASE_URL: http://api:8005
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      PORT: 5000
      CORS_ORIGINS: http://localhost:5001
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../backend:/app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask-admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.services.flask-admin.loadbalancer.server.port=5000"

  # PostgreSQL backup job (daily at 2 AM)
  postgres-backup:
    image: postgres:16
    container_name: tickets_postgres_backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tickets_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ../backend/scripts/db/backup_postgres.sh:/backup_postgres.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y curl cron
        curl -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
        chmod +x /usr/local/bin/mc
        echo "0 2 * * * /bin/bash /backup_postgres.sh >> /var/log/cron.log 2>&1" > /etc/cron.d/postgres-backup
        chmod 0644 /etc/cron.d/postgres-backup
        crontab /etc/cron.d/postgres-backup
        touch /var/log/cron.log
        cron && tail -f /var/log/cron.log
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started

  # Soft-delete purge job (daily at 3 AM)
  purge-deleted:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tickets_purge_deleted
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tickets_db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../backend/scripts/db/purge_deleted_folders.py:/app/purge_deleted_folders.py:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y cron
        echo "0 3 * * * cd /app && python purge_deleted_folders.py >> /var/log/cron.log 2>&1" > /etc/cron.d/purge-deleted
        chmod 0644 /etc/cron.d/purge-deleted
        crontab /etc/cron.d/purge-deleted
        touch /var/log/cron.log
        cron && tail -f /var/log/cron.log
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started

  # Audit log archival job (monthly on 1st at 4 AM)
  archive-audit-logs:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tickets_archive_audit_logs
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tickets_db
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      AUDIT_ARCHIVE_RETENTION_MONTHS: "12"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../backend/scripts/db/archive_audit_logs.py:/app/archive_audit_logs.py:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y cron
        echo "0 4 1 * * cd /app && python archive_audit_logs.py >> /var/log/cron.log 2>&1" > /etc/cron.d/archive-audit-logs
        chmod 0644 /etc/cron.d/archive-audit-logs
        crontab /etc/cron.d/archive-audit-logs
        touch /var/log/cron.log
        cron && tail -f /var/log/cron.log
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  mlflow_data:
  prometheus_data:
  loki_data:
  grafana_data:
  qdrant_data:

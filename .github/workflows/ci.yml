name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Job 1: Lint with Ruff
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.4

      - name: Run Ruff linting
        run: |
          ruff check . --output-format=github
          
      - name: Run Ruff format check
        run: |
          ruff format --check .

  # Job 2: Cyclomatic Complexity Check (Radon)
  complexity:
    name: Cyclomatic Complexity (Radon)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Radon
        run: |
          python -m pip install --upgrade pip
          pip install radon==6.0.1

      - name: Run Radon cyclomatic complexity check
        run: |
          echo "Checking cyclomatic complexity (threshold: C, max complexity: 10)..."
          radon cc . -n C --total-average --show-complexity --json -o radon-cc-report.json || true
          radon cc . -n C --total-average --show-complexity

      - name: Upload Radon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radon-complexity-report
          path: radon-cc-report.json

      - name: Fail on high complexity
        run: |
          # Check if any function has complexity > 10 (grade C or worse)
          # radon cc with -n C shows only functions with complexity >= 11
          OUTPUT=$(radon cc . -n C --total-average)
          if echo "$OUTPUT" | grep -E "^[A-Z]"; then
            echo "ERROR: Functions with cyclomatic complexity > 10 detected:"
            echo "$OUTPUT"
            echo ""
            echo "Please refactor these functions to reduce complexity or request an exemption."
            exit 1
          else
            echo "All functions have acceptable cyclomatic complexity (≤ 10)"
          fi

  # Job 3: Type Annotation Enforcement (mypy)
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.11.2

      - name: Run mypy type checking
        run: |
          echo "Running mypy type checking (PEP 484 compliance)..."
          mypy . \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --no-implicit-optional \
            --strict-equality \
            --show-error-codes \
            --pretty \
            --exclude '/(\.venv|\.hypothesis|\.ruff_cache|\.pytest_cache|node_modules|alembic/versions)/' \
            || true

      - name: Run mypy with strict mode on public APIs
        run: |
          # Enforce strict type checking on public API modules
          mypy src/api/ src/services/ src/repositories/ src/ml/ src/schemas/ \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --no-implicit-optional \
            --strict-equality \
            --show-error-codes \
            --pretty

  # Job 4: SAST - Bandit + Semgrep
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.3

      - name: Run Bandit SAST
        run: |
          bandit -r . -ll -f json -o bandit-report.json || true
          bandit -r . -ll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
          generateSarif: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # Job 5: Test with pytest and testcontainers
  test:
    name: Test (pytest + testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_tickets_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_tickets_db
        run: |
          pytest tests/ \
            --cov=src \
            --cov=config \
            --cov=flask_admin \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=pytest-report.xml \
            -v

      - name: Run Flask application tests
        env:
          PYTHONPATH: .
          SECRET_KEY: test-secret-key
          API_BASE_URL: http://localhost:8000
          FLASK_ENV: testing
        run: |
          pytest tests/unit/test_flask_admin.py \
            tests/unit/test_api_client.py \
            tests/unit/test_templates.py \
            -v --tb=short

      - name: Run Flask template rendering tests
        env:
          PYTHONPATH: .
          SECRET_KEY: test-secret-key
          API_BASE_URL: http://localhost:8000
          FLASK_ENV: testing
        run: |
          pytest tests/unit/test_templates.py \
            -v --tb=short \
            -k "test_template_rendering"

      - name: Upload coverage report (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            pytest-report.xml

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

  # Job 6: Coverage report summary
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-report-*
          merge-multiple: true

      - name: Display coverage summary
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
            cat coverage.xml | grep -o 'line-rate="[^"]*"' | head -1
          else
            echo "No coverage report found"
          fi

  # Job 7: Flask Docker Build and Test
  flask-build-test:
    name: Flask Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Flask admin Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.flask
          push: false
          load: true
          tags: flask-admin-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Flask service startup
        run: |
          echo "Testing Flask admin service startup..."
          
          # Start Flask service
          docker run -d --name flask-startup-test \
            -p 5000:5000 \
            -e SECRET_KEY=test-secret-key-for-ci \
            -e API_BASE_URL=http://mock-api:8000 \
            -e FLASK_ENV=production \
            -e DEBUG=False \
            flask-admin-test:latest
          
          # Wait for service to initialize
          sleep 15
          
          # Test health endpoint
          echo "Testing health endpoint..."
          if curl -f -s http://localhost:5000/health | grep -q "healthy"; then
            echo "SUCCESS: Health endpoint responding correctly"
          else
            echo "ERROR: Health endpoint test failed"
            docker logs flask-startup-test
            exit 1
          fi
          
          # Test main routes accessibility (should return HTML)
          echo "Testing main routes..."
          if curl -f -s http://localhost:5000/ | grep -q "html"; then
            echo "SUCCESS: Dashboard route accessible"
          else
            echo "ERROR: Dashboard route test failed"
            docker logs flask-startup-test
            exit 1
          fi
          
          # Cleanup
          docker stop flask-startup-test
          docker rm flask-startup-test

  # Job 8: Container scan with Trivy
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: tickets-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: tickets-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build flask-admin Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.flask
          push: false
          load: true
          tags: tickets-flask-admin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tickets-api:test
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tickets-frontend:test
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner (flask-admin)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tickets-flask-admin:test
          format: 'sarif'
          output: 'trivy-flask-admin-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload Trivy results (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      - name: Upload Trivy results (flask-admin)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-flask-admin-results.sarif'
          category: 'trivy-flask-admin'

      - name: Check for CRITICAL vulnerabilities (backend)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL --exit-code 1 tickets-api:test

      - name: Check for CRITICAL vulnerabilities (frontend)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL --exit-code 1 tickets-frontend:test

      - name: Check for CRITICAL vulnerabilities (flask-admin)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL --exit-code 1 tickets-flask-admin:test

      - name: Verify Flask service startup
        run: |
          echo "Starting Flask admin service for verification..."
          docker run -d --name flask-test \
            -p 5000:5000 \
            -e SECRET_KEY=test-secret-key \
            -e API_BASE_URL=http://localhost:8000 \
            -e FLASK_ENV=production \
            tickets-flask-admin:test
          
          # Wait for service to start
          sleep 10
          
          # Check health endpoint
          if curl -f http://localhost:5000/health; then
            echo "SUCCESS: Flask service started successfully"
          else
            echo "ERROR: Flask service failed to start"
            docker logs flask-test
            exit 1
          fi
          
          # Cleanup
          docker stop flask-test
          docker rm flask-test

  # Job 9: Quality gate summary
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, complexity, type-check, sast, test, coverage, flask-build-test, container-scan]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Complexity: ${{ needs.complexity.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "SAST: ${{ needs.sast.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Flask Build Test: ${{ needs.flask-build-test.result }}"
          echo "Container Scan: ${{ needs.container-scan.result }}"
          
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.complexity.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.flask-build-test.result }}" != "success" ] || \
             [ "${{ needs.container-scan.result }}" != "success" ]; then
            echo "Quality gate FAILED"
            exit 1
          fi
          
          echo "Quality gate PASSED"

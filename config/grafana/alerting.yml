apiVersion: 1

groups:
  - orgId: 1
    name: 'Infrastructure Alerts'
    folder: 'SRE'
    interval: 60s
    rules:
      - uid: 'api_down_alert'
        title: 'API Service Down'
        condition: 'A'
        data:
          - refId: 'A'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasourceUid: 'prometheus'
              expr: 'up{job="api"} == 0'
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: 'A'
        noDataState: 'NoData'
        execErrState: 'Error'
        for: '5m'
        annotations:
          summary: 'Service {{ $labels.job }} is down'
          description: 'The API service has been unreachable for more than 5 minutes.'
        labels:
          severity: 'critical'
